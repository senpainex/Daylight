name: Mobile native builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile.html'
      - 'mobile-*.js'
      - 'mobile-*.css'
      - 'conferbot.css'
      - 'firebase-config.json'
      - 'firebase-config.example.json'
      - 'manifest.webmanifest'
      - 'daylight-icon.svg'
      - 'privacy.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'sw.js'
      - 'scripts/**'
      - '.github/workflows/mobile-builds.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate web bundle and Android project
        run: |
          npm run build:mobile
          npx cap add android
          npx cap sync android
      - name: Compile Android app
        run: cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-android-build-check
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate web bundle and iOS project
        run: |
          npm run build:mobile
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/DaylightDerived" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-ios-simulator-build-check
          path: ${{ runner.temp }}/DaylightDerived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
